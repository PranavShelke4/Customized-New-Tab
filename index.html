<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://apis.google.com/js/api.js"></script>
  </head>
  <body>
    <div class="background container" id="background">
      <div class="overlay">
        <div class="top-bar">
          <div class="left-side">
            <div class="links" id="showLinksPopup">
              <img
                class="link-icon"
                id="addLinks"
                src="../assets/icons/link.svg"
              />
              <p class="link-title">Links</p>
            </div>
            <div class="links" id="showFocusPopup">
              <img
                class="focus-icon"
                id="focusIcon"
                src="../assets/icons/focus.svg"
              />
              <p class="focus-time" id="focusCountdown"></p>
              <p class="link-title" id="focus-title">Focus</p>
            </div>
            <div class="calendar" id="showCalendarPopup">
              <img class="calendar-icon" src="../assets/icons/calendar.svg" />
              <p class="link-title">Calendar</p>
            </div>
          </div>
          <div class="right-side">
            <div class="weather">
              <p class="deadline-time hidden" id="deadlineTime">--</p>
              <img
                class="plus-icon"
                src="../assets/icons/add.svg"
                alt="Add Countdown"
                id="addCountdown"
              />
              <p class="deadline-title">Deadline</p>
            </div>
            <div class="weather-links">
              <div class="weather">
                <p class="weather-title">--°C</p>
                <p class="weather-city">--</p>
              </div>
            </div>
          </div>
        </div>
        <div class="header">
          <div class="time" id="time">--:--</div>
          <div class="greeting" id="greeting">Good evening,</div>
        </div>
        <div class="bottom-bar">
          <p class="quote" id="quote"></p>
        </div>
      </div>
    </div>

    <!-- Countdown Popup -->
    <div class="small-popup" id="countdown-popup">
      <div class="popup-content glass">
        <h2 id="popupTitle">Set Countdown</h2>
        <div>
          <label for="description">Description:</label>
          <input
            type="text"
            id="description"
            name="description"
            class="styled-input"
          />
          <label for="endDate">End Date:</label>
          <input
            type="datetime-local"
            id="endDate"
            name="endDate"
            class="styled-input"
          />
          <button id="setCountdownButton" class="styled-button">
            Set Countdown
          </button>
        </div>
        <button id="closePopup" class="styled-button">Close</button>
      </div>
    </div>

    <!-- Links Popup -->
    <div class="link-popup" id="links-popup">
      <div class="popup-content glass" id="link-popup-content">
        <div id="savedLinks"></div>
        <img
          class="addLinkIcon"
          src="../assets/icons/add2.svg"
          alt="Add Link"
          id="showAddLinkForm"
        />
        <div id="linksForm" style="display: none">
          <label for="linkTitle">Title:</label>
          <input
            type="text"
            id="linkTitle"
            name="linkTitle"
            class="styled-input"
            required
          />
          <label for="linkURL">URL:</label>
          <input
            type="url"
            id="linkURL"
            name="linkURL"
            class="styled-input"
            required
          />
          <button id="submitLink" class="styled-button">Done</button>
          <button type="button" id="cancelAddLink" class="styled-button">
            Cancel
          </button>
        </div>
        <button id="closeLinksPopup" class="styled-button">Close</button>
      </div>
    </div>

    <!-- Focus Popup -->
    <div class="focus-popup" id="focus-popup">
      <div class="popup-content glass">
        <h2 id="focusPopupTitle">Set Focus Time</h2>
        <div>
          <input
            type="number"
            id="focusHours"
            name="focusHours"
            class="styled-input"
            min="0"
            placeholder="Hours"
          />
          <input
            type="number"
            id="focusMinutes"
            name="focusMinutes"
            class="styled-input"
            min="0"
            placeholder="Minutes"
          />
          <button id="startFocus" class="styled-button">Start</button>
          <button type="button" id="closeFocusPopup" class="styled-button">
            Close
          </button>
        </div>
        <div id="focusCountdownDisplay" style="display: none"></div>
      </div>
    </div>

    <!-- Calendar Popup -->
    <div class="calendar-popup" id="calendar-popup">
      <div class="popup-content glass">
        <h2>Google Calendar</h2>
        <div id="calendarEvents"></div>
        <div id="addEventForm" style="display: none">
          <h3>Add New Event</h3>
          <div>
            <label for="eventSummary">Summary:</label>
            <input
              type="text"
              id="eventSummary"
              name="eventSummary"
              class="styled-input"
              required
            />
            <label for="eventStart">Start Time:</label>
            <input
              type="datetime-local"
              id="eventStart"
              name="eventStart"
              class="styled-input"
              required
            />
            <label for="eventEnd">End Time:</label>
            <input
              type="datetime-local"
              id="eventEnd"
              name="eventEnd"
              class="styled-input"
              required
            />
            <button id="submitEvent" class="styled-button">Add Event</button>
            <button type="button" id="cancelAddEvent" class="styled-button">
              Cancel
            </button>
          </div>
        </div>
        <button id="addEventButton" class="styled-button">Add Event</button>
        <button id="closeCalendarPopup" class="styled-button">Close</button>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
